name: Build & Basic Security Checks

# No publishing. Runs on the ci/* branch that carries this file (so the checks
# can run before the workflow is merged to main) and manually afterwards:
#   gh workflow run ci-security.yml -R <owner>/<repo> --ref <branch>
on:
  push:
    branches:
      - 'ci/security-checks'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: whisperx-asr-service:ci

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis: lint, SAST, secret scan over full git history
  # ---------------------------------------------------------------------------
  static-security:
    name: Static (ruff + bandit + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install analysis tools
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff bandit

      - name: Compile check (all sources)
        run: python -m compileall -q app tests

      - name: Ruff lint (E4/E7/E9/F + I rules)
        run: ruff check --select E4,E7,E9,F,I app tests

      - name: Bandit SAST (HIGH and MEDIUM)
        run: bandit -r -q -ll app

      - name: Gitleaks secret scan (working tree + full git history)
        run: |
          docker run --rm \
            -v "$PWD":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --exit-code 1

  # ---------------------------------------------------------------------------
  # Dependency vulnerability audit (pins mirrored from the Dockerfile)
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: pip-audit (runtime deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: python -m pip install --quiet --upgrade pip && pip install --quiet pip-audit

      - name: Audit pinned runtime dependencies
        run: |
          cat > /tmp/audit-reqs.txt <<'EOF'
          # Direct pins/constraints from Dockerfile (ci-security workflow).
          # Note: whisperX is installed from git in the image and cannot be
          # audited here; the built image itself is scanned by Trivy instead.
          fastapi==0.104.1
          uvicorn[standard]==0.24.0
          python-multipart==0.0.6
          pydantic==2.5.0
          prometheus-client==0.20.0
          torch==2.7.1
          torchaudio==2.7.1
          transformers>=5.13,<6
          ray[serve]>=2.9
          protobuf<7
          EOF
          pip-audit --desc on -r /tmp/audit-reqs.txt

  # ---------------------------------------------------------------------------
  # Container build + image-level checks (no push, no publish)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build + hadolint + trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build (default variant, torch 2.7.1 cu126)
        run: docker build --tag "$IMAGE_TAG" .

      - name: Hadolint Dockerfiles (fail on errors only)
        run: |
          docker run --rm -v "$PWD":/lint -w /lint \
            ghcr.io/hadolint/hadolint:latest \
            --failure-threshold error Dockerfile Dockerfile.spark

      - name: Python dependency consistency inside image (pip check)
        run: docker run --rm --entrypoint python "$IMAGE_TAG" -m pip check

      - name: Import smoke test inside image
        run: |
          docker run --rm --entrypoint python "$IMAGE_TAG" -c \
            "import app.main, app.serve_app; import fastapi, pydantic, whisperx, transformers; print('imports OK')"

      - name: Trivy CVE scan (HIGH and CRITICAL; fails on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-cache":/root/.cache \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --timeout 20m \
            "$IMAGE_TAG"

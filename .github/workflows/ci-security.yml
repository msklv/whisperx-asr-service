name: Build & Basic Security Checks

# No publishing. Runs on the ci/* branch that carries this file (so the checks
# can run before the workflow is merged to main) and manually afterwards:
#   gh workflow run ci-security.yml -R <owner>/<repo> --ref <branch>
on:
  push:
    branches:
      - 'hardening/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: whisperx-asr-service:ci

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis: lint, SAST, secret scan over full git history
  # ---------------------------------------------------------------------------
  static-security:
    name: Static (ruff + bandit + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install analysis tools
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff bandit

      - name: Gitleaks secret scan (working tree + full git history)
        run: |
          docker run --rm \
            -v "$PWD":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --exit-code 1

      - name: Bandit SAST (HIGH and MEDIUM)
        run: bandit -r -q -ll app

      - name: Compile check (all sources)
        run: python -m compileall -q app tests

      - name: Ruff lint (E4/E7/E9/F + I rules)
        run: ruff check --select E4,E7,E9,F,I app tests

  # ---------------------------------------------------------------------------
  # Dependency vulnerability audit (pins mirrored from the Dockerfile)
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: pip-audit (runtime deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: python -m pip install --quiet --upgrade pip && pip install --quiet pip-audit

      - name: Audit pinned runtime dependencies (auto-extracted from Dockerfile)
        run: |
          python3 - <<'PY'
          import re
          src = open('Dockerfile').read()
          lines = src.splitlines()
          out = []
          m = re.search(r'^ARG TORCH_VERSION=(\S+)', src, re.M)
          if m:
              out += ['torch==' + m.group(1), 'torchaudio==' + m.group(1)]
          m = re.search(r'pip3 install --no-cache-dir\s+"(transformers[^"]+)"', src)
          if m:
              out.append(m.group(1))
          starts = [i for i, l in enumerate(lines)
                    if l.strip().startswith('pip3 install --no-cache-dir') and l.rstrip().endswith('\\')]
          if starts:
              for l in lines[starts[-1] + 1:]:
                  if not re.match(r'^ {8}\S', l):
                      break
                  pkg = l.strip().rstrip('\\').strip().strip('"')
                  if pkg and '${' not in pkg:
                      out.append(pkg)
          open('/tmp/audit-reqs.txt', 'w').write('\n'.join(out) + '\n')
          print('Auditing:', ', '.join(out))
          PY
          # --ignore-vuln: accepted risks documented in osv-scanner.toml
          # (torch CVE-2025-3000: no torchaudio 2.13 exists anywhere;
          #  setuptools <83: build-time sdist flaw, torch needs <82)
          pip-audit --desc on -r /tmp/audit-reqs.txt \
            --ignore-vuln PYSEC-2025-194 --ignore-vuln GHSA-rrmf-rvhw-rf47 \
            --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-h35f-9h28-mq5c \
            --ignore-vuln GHSA-8mgp-746c-j5xp --ignore-vuln PYSEC-2026-3740

      - name: OSV-Scanner (Google) — cross-check deps against OSV database
        if: always()  # run even when pip-audit reports findings
        run: |
          # Pinned: v2's transitive resolver fails on ray[serve] metadata
          # (deps.dev lacks opentelemetry-exporter-prometheus pin), and
          # transitive deps are covered by the in-image pip-audit anyway.
          go install github.com/google/osv-scanner/cmd/osv-scanner@v2.5.1
          mkdir -p /tmp/osv-audit
          cp /tmp/audit-reqs.txt /tmp/osv-audit/requirements.txt
          cp osv-scanner.toml /tmp/osv-audit/osv-scanner.toml
          "$(go env GOPATH)/bin/osv-scanner" scan --no-resolve --config /tmp/osv-audit/osv-scanner.toml /tmp/osv-audit

  # ---------------------------------------------------------------------------
  # Container build + image-level checks (no push, no publish)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build + hadolint + trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build (default variant, torch 2.11.0 cu126)
        run: docker build --tag "$IMAGE_TAG" .

      - name: Hadolint Dockerfiles (fail on errors only)
        run: |
          curl -sSfL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error Dockerfile Dockerfile.spark

      - name: Python dependency consistency inside image (pip check)
        # continue-on-error: report conflicts but never block the image CVE scans
        continue-on-error: true
        run: docker run --rm --entrypoint python3 "$IMAGE_TAG" -m pip check

      - name: Import smoke test inside image
        run: |
          docker run --rm --entrypoint python3 "$IMAGE_TAG" -c \
            "import app.main, app.serve_app; import fastapi, pydantic, whisperx, transformers; print('imports OK')"

      - name: pip-audit of the installed environment inside the image
        # Covers transitive deps (whisperx/pyannote/ray); report-only so known
        # residual findings never hide the other image checks.
        continue-on-error: true
        run: |
          docker run --rm --entrypoint bash "$IMAGE_TAG" -c \
            "pip3 install -q --disable-pip-version-check pip-audit >/dev/null 2>&1 && pip-audit"

      - name: Trivy CVE gate (CRITICAL only)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-cache":/root/.cache \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 1 \
            --timeout 20m \
            "$IMAGE_TAG"

      - name: Trivy HIGH/MEDIUM report (non-blocking)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-cache":/root/.cache \
            aquasec/trivy:latest image \
            --severity HIGH,MEDIUM \
            --timeout 20m \
            "$IMAGE_TAG" || true
